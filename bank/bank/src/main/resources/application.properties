spring.application.name=nexusmarket
server.port=8080

# In-memory adapters are used for this delivery; no real database is required.
# Disable auto-configurations for JDBC, JPA, MongoDB and Security so the app starts cleanly.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.MongoDataAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.MongoRepositoriesAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.servlet.UserDetailsServiceAutoConfiguration
