spring.application.name=nexusmarket
server.port=8080

# MySQL persistence. Credentials come from environment variables so no secret is stored in the repository.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# First administrator created on startup when the platform has none.
nexusmarket.bootstrap.admin.identifier=${ADMIN_IDENTIFIER:1000000000}
nexusmarket.bootstrap.admin.full-name=${ADMIN_FULL_NAME:NexusMarket Administrator}
nexusmarket.bootstrap.admin.email=${ADMIN_EMAIL:admin@nexusmarket.com}
